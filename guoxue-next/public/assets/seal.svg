<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 印章外框 - 方形篆刻风格 -->
  <rect x="5" y="5" width="90" height="90" rx="3" fill="#c53d43"/>

  <!-- 内边框装饰 -->
  <rect x="10" y="10" width="80" height="80" rx="2" fill="none" stroke="#f5e6d3" stroke-width="2" opacity="0.7"/>

  <!-- 简化的"国学"二字 -->
  <text x="50" y="42" text-anchor="middle" fill="#f5e6d3" font-size="22" font-weight="bold" font-family="SimSun, serif">国学</text>

  <!-- 简化的"词典"二字 -->
  <text x="50" y="72" text-anchor="middle" fill="#f5e6d3" font-size="22" font-weight="bold" font-family="SimSun, serif">词典</text>

  <!-- 印章磨损纹理 -->
  <g opacity="0.2" fill="#8b1a1a">
    <circle cx="20" cy="30" r="3"/>
    <circle cx="78" cy="22" r="2"/>
    <circle cx="82" cy="75" r="4"/>
    <circle cx="18" cy="78" r="2.5"/>
    <circle cx="50" cy="50" r="1.5"/>
    <circle cx="35" cy="85" r="2"/>
    <circle cx="70" cy="45" r="1.8"/>
  </g>
</svg>
