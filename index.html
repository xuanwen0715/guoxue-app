<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>国学智能词典 · 墨韵书香</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="国学智能词典：以简驭繁 · 智解文义，支持古文上下文与单字查询，以及生僻字截图上传。">
</head>
<body>
    <!-- 古典纸纹背景层 -->
    <div class="paper-texture" aria-hidden="true"></div>

    <div class="container">
        <header class="header">
            <!-- 标题凤凰装饰 -->
            <img class="phoenix-header" src="assets/phoenix-colorful.png" alt="" aria-hidden="true">

            <!-- 印章装饰 -->
            <img class="seal-decor" src="assets/seal.svg" alt="" aria-hidden="true">

            <h1 class="title-calligraphy">国学智能词典</h1>
            <p class="subtitle">以简驭繁 · 智解文义</p>

            <!-- 标题下方古典分隔线 -->
            <div class="title-divider" aria-hidden="true">
                <span class="divider-line"></span>
                <span class="divider-dot"></span>
                <span class="divider-line"></span>
            </div>

            <div id="mock-mode-notice" style="background: #fff3cd; border: 1px solid #ffd60e; border-radius: 6px; padding: 8px; margin: 10px 0; text-align: center; font-size: 14px; display: none;">
                <strong>演示模式</strong> - 当前使用模拟数据，如需真实AI查询请配置API服务器
            </div>
        </header>

        <!-- Phoenix decor - 绚丽凤凰装饰 -->
        <div class="phoenix-decor" aria-hidden="true">
            <img class="phoenix phoenix-left" src="assets/phoenix-colorful.png" alt="">
            <img class="phoenix phoenix-right" src="assets/phoenix-colorful.png" alt="">
        </div>

        <label for="context-input" class="field-label">
            <span class="label-icon">卷</span>
            古文原文 / Classical Text
        </label>
        <div class="context-drop" id="context-drop-zone" aria-label="粘贴/拖拽原文截图或点击上传">
            <div class="context-tools inside">
                <input type="file" id="context-image-uploader" accept="image/*" hidden>
                <button id="context-upload-button" class="btn btn-secondary icon-btn" type="button" aria-controls="context-image-uploader" aria-label="上传原文截图" title="上传原文截图"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5a2 2 0 0 0-2-2h-3.2l-.6-1.2A1 1 0 0 0 14.3 1h-4.6a1 1 0 0 0-.9.8L8.2 3H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5Zm-9 10 2.03-2.71a1 1 0 0 1 1.58-.03L17 14h2l-3.23-4.3a2 2 0 0 0-3.16.05L9 14l-2-2-3 4h8Zm6-7.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path></svg><span class="spinner" aria-hidden="true"></span><span class="sr-only">上传原文截图</span></button>
                <span id="context-upload-status" class="upload-status" aria-live="polite"></span>
            </div>
            <textarea id="context-input" class="field" placeholder="可直接粘贴文字，或粘贴/拖拽原文截图自动识别（例如：道可道，非常道……）" spellcheck="false"></textarea>
        </div>

        <div class="inline-fields">
            <div class="inline-field">
                <label for="word-input" class="field-label">
                    <span class="label-icon">字</span>
                    字/词查询 / Character · Word
                </label>
                <input type="text" id="word-input" class="field" inputmode="text" placeholder="输入字或词（例如：道、无为、仁义） / Enter a character or word (e.g., 道, 无为, 仁义)" aria-describedby="word-hint">
                <div id="word-hint" class="help">支持多字/生僻字；按 Enter 快速查询 · Supports multiple/rare characters; press Enter</div>
            </div>
            <div class="uploader-wrapper" id="drop-zone" aria-label="拖拽图片到此处或点击上传">
                <span class="uploader-hint">上传生僻字截图 · Upload rare‑character screenshot</span><input type="file" id="image-uploader" accept="image/*" hidden>
                <button id="upload-button" class="btn btn-secondary icon-btn" type="button" aria-controls="image-uploader" aria-label="上传生僻字截图" title="上传生僻字截图"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5a2 2 0 0 0-2-2h-3.2l-.6-1.2A1 1 0 0 0 14.3 1h-4.6a1 1 0 0 0-.9.8L8.2 3H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5Zm-9 10 2.03-2.71a1 1 0 0 1 1.58-.03L17 14h2l-3.23-4.3a2 2 0 0 0-3.16.05L9 14l-2-2-3 4h8Zm6-7.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path></svg><span class="spinner" aria-hidden="true"></span><span class="sr-only">上传生僻字截图</span></button>
                <span id="upload-status" class="upload-status" aria-live="polite"></span>
            </div>
        </div>


        <!-- 古典分隔装饰 -->
        <div class="section-divider" aria-hidden="true">
            <span class="divider-wing left"></span>
            <span class="divider-center">❖</span>
            <span class="divider-wing right"></span>
        </div>

        <div class="actions">
            <button id="submit-button" class="btn btn-primary" type="button">AI 智能查询 · AI Smart Lookup</button>
            <div class="secondary-group">
                <button id="copy-button" class="btn btn-secondary" type="button" aria-label="复制查询结果 / Copy results">复制结果 · Copy</button>
                <button id="clear-button" class="btn btn-secondary" type="button" aria-label="清空输入 / Clear inputs">清空输入 · Clear</button>
            </div>
        </div>

        <section id="result-container" class="result-box scroll-style" aria-live="polite" aria-busy="false"><div id="result-structured" class="result-structured" hidden></div><p id="result-text">查询结果将显示在这里...</p><div class="scroll-corner top-left" aria-hidden="true"></div><div class="scroll-corner top-right" aria-hidden="true"></div><div class="scroll-corner bottom-left" aria-hidden="true"></div><div class="scroll-corner bottom-right" aria-hidden="true"></div></section>
    </div>

    <!-- 古典分隔线 -->
    <div class="history-divider" aria-hidden="true">
        <span class="divider-ornament">◆</span>
    </div>

    <section class="history" aria-label="查询历史 / History">
        <div class="history-card">
            <div class="history-header">
                <h2 class="history-title">
                    <span class="history-icon">册</span>
                    查询历史
                    <span class="history-subtitle">History</span>
                </h2>
            </div>

            <div class="history-toolbar">
                <label class="history-filter" for="history-favs-only">
                    <input type="checkbox" id="history-favs-only">
                    <span class="filter-icon">★</span>
                    <span class="filter-text">仅看收藏</span>
                </label>
                <div class="history-actions">
                    <button id="export-history" class="btn btn-history" type="button" title="导出历史记录">
                        <span class="btn-icon">↓</span>
                        <span class="btn-text">导出</span>
                    </button>
                    <input type="file" id="import-history-input" accept="application/json" hidden>
                    <button id="import-history" class="btn btn-history" type="button" title="导入历史记录">
                        <span class="btn-icon">↑</span>
                        <span class="btn-text">导入</span>
                    </button>
                    <button id="clear-history" class="btn btn-history btn-danger" type="button" title="清空所有历史">
                        <span class="btn-icon">✕</span>
                        <span class="btn-text">清空</span>
                    </button>
                </div>
            </div>

            <ul id="history-list" class="history-list" aria-live="polite">
                <!-- 历史记录项会在这里动态生成 -->
            </ul>

            <div class="history-empty" id="history-empty">
                <span class="empty-icon">📜</span>
                <p>暂无查询记录</p>
                <p class="empty-hint">查询的字词会自动保存在这里</p>
            </div>
        </div>
    </section>

    <!-- 页脚装饰 -->
    <footer class="footer" aria-hidden="true">
        <div class="footer-divider"></div>
        <p class="footer-text">国学智能词典 · 以简驭繁 · 智解文义</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
